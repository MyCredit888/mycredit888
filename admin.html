<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>MyCredit Admin</title>

<style>
body{
  font-family: Arial;
  background:#f4f4f4;
  text-align:center;
  padding:40px;
}

.box{
  background:white;
  padding:20px;
  max-width:420px;
  margin:auto;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.1);
}

input{
  width:90%;
  padding:10px;
  margin:10px 0;
}

button{
  padding:10px 20px;
  background:#25D366;
  border:none;
  color:white;
  border-radius:5px;
  cursor:pointer;
}

#panel{
  display:none;   /* 🔒 默认隐藏后台 */
}
</style>
</head>
<body>

<div class="box">

<h2>Admin Panel</h2>

<!-- 🔐 LOGIN -->
<div id="loginBox">
  <input id="email" placeholder="Email"><br>
  <input id="password" type="password" placeholder="Password"><br>
  <button onclick="login()">Login</button>
</div>

<!-- 🔒 ONLY AFTER LOGIN -->
<div id="panel">

  <h3>WhatsApp Settings</h3>

  <input id="num1" placeholder="WhatsApp 1"><br>
  <input id="num2" placeholder="WhatsApp 2"><br>

  <button onclick="save()">Save</button>

</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 Firebase config */
const firebaseConfig = {
  apiKey: "AIzaSyCY1QzAMI5O3oqnf_l7rKLfprR2hJrpFfA",
  authDomain: "mycr-443cc.firebaseapp.com",
  projectId: "mycr-443cc"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* 🔐 LOGIN */
window.login = function () {
  signInWithEmailAndPassword(
    auth,
    email.value,
    password.value
  ).then(() => {
    alert("Login success");
  }).catch(e => alert(e.message));
}

/* 👁️ detect login state */
onAuthStateChanged(auth, (user) => {
  if (user) {
    document.getElementById("loginBox").style.display = "none";
    document.getElementById("panel").style.display = "block";
    loadData();
  } else {
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("panel").style.display = "none";
  }
});

/* 💾 save */
window.save = async function () {

  await auth.currentUser.getIdToken(true);
  await setDoc(doc(db, "setting", "whatsapp"), {
    number1: num1.value,
    number2: num2.value
  });

  alert("Saved!");
}

/* 📥 load */
async function loadData() {
  const snap = await getDoc(doc(db, "setting", "whatsapp"));

  if (snap.exists()) {
    num1.value = snap.data().number1;
    num2.value = snap.data().number2;
  }
}
</script>

</body>
</html>
