<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
</head>
<body>

<h2>Admin Login</h2>

<input id="email" placeholder="Email">
<br><br>
<input id="password" type="password" placeholder="Password">
<br><br>
<button onclick="login()">Login</button>

<hr>

<h2>Update WhatsApp Numbers</h2>

<input id="num1" placeholder="Number 1">
<br><br>
<input id="num2" placeholder="Number 2">
<br><br>

<button onclick="save()">Save</button>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* 🔥 这里换成你的 Firebase config */
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* 登录 */
window.login = function () {
  signInWithEmailAndPassword(
    auth,
    email.value,
    password.value
  ).then(() => {
    alert("Login success");
    loadData();
  }).catch(e => alert(e.message));
}

/* 保存号码 */
window.save = async function () {
  await setDoc(doc(db, "settings", "whatsapp"), {
    number1: num1.value,
    number2: num2.value
  });

  alert("Saved!");
}

/* 读取现有号码 */
async function loadData() {
  const snap = await getDoc(doc(db, "settings", "whatsapp"));

  if (snap.exists()) {
    num1.value = snap.data().number1;
    num2.value = snap.data().number2;
  }
}
</script>

</body>
</html>
